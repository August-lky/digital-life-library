<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>图书馆管理页</title>
<style>
:root{--bg:#f6f4ef;--card:#fff;--ink:#2b2a27;--mute:#77746c;--line:#e2ded3;--accent:#2f6f5e;--warn:#b5532f;--chip:#ece8dc}
@media (prefers-color-scheme:dark){:root{--bg:#1d1c1a;--card:#262522;--ink:#ece9e0;--mute:#9b978c;--line:#3a3833;--accent:#6fbfa6;--warn:#e08a63;--chip:#33312c}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.6 system-ui,"Microsoft YaHei",sans-serif}
header{padding:14px 20px;border-bottom:1px solid var(--line);display:flex;gap:16px;align-items:baseline;flex-wrap:wrap}
header h1{font-size:18px;margin:0}
header small{color:var(--mute)}
main{display:grid;grid-template-columns:minmax(300px,1fr) minmax(320px,1.2fr);gap:16px;padding:16px 20px;max-width:1200px;margin:0 auto}
@media (max-width:820px){main{grid-template-columns:1fr}}
.card{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:14px}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
input,select,textarea,button{font:inherit;color:inherit;background:var(--card);border:1px solid var(--line);border-radius:6px;padding:5px 9px}
textarea{width:100%;min-height:60px}
input[type=text],input[type=search],input[type=password]{min-width:0}
button{cursor:pointer}
button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
button.warn{color:var(--warn);border-color:var(--warn)}
.chip{display:inline-block;background:var(--chip);border-radius:999px;padding:0 9px;font-size:12.5px;color:var(--mute);margin-right:4px}
.chip.flag{color:var(--warn)}
ul{list-style:none;margin:10px 0 0;padding:0}
li.item{padding:7px 8px;border-radius:6px;cursor:pointer;border-bottom:1px solid var(--line)}
li.item:hover,li.item.on{background:var(--chip)}
li.item b{margin-right:6px}
li.item .b{color:var(--mute);font-size:13.5px;display:block}
li.dim{opacity:.55}
label{display:block;margin:8px 0 2px;color:var(--mute);font-size:13px}
.hist{font-size:12.5px;color:var(--mute);margin:4px 0}
#msg{min-height:1.4em;color:var(--accent)}
#msg.err{color:var(--warn)}
#gate{max-width:420px;margin:12vh auto;text-align:center}
.hide{display:none!important}
dl{margin:8px 0}dt{color:var(--mute);font-size:13px}dd{margin:0 0 6px}
</style>
</head>
<body>
<div id="gate" class="card">
  <h2>图书馆管理页</h2>
  <p>把令牌粘贴进来（在图书馆目录里的 server.token 文件里）。</p>
  <form id="gateForm" class="row" style="justify-content:center">
    <input id="tok" type="password" placeholder="令牌" autocomplete="off" style="width:240px">
    <button class="primary">进入</button>
  </form>
  <p id="gateMsg" class="err"></p>
</div>

<div id="app" class="hide">
<header>
  <h1>图书馆管理页</h1>
  <small id="stats"></small>
  <span id="msg" style="margin-left:auto"></span>
</header>
<main>
  <section class="card">
    <div class="row">
      <input id="q" type="search" placeholder="搜梗（名字、半句、变体都行）" style="flex:1;min-width:140px">
      <select id="fSource"><option value="">全部来源</option></select>
      <select id="fBy"><option value="">谁存的：全部</option></select>
      <select id="fStatus"><option value="">状态：全部</option></select>
    </div>
    <div class="row" style="margin-top:8px">
      <span id="total" class="chip"></span>
      <button id="prev">上一页</button><button id="next">下一页</button>
      <button id="addBtn" class="primary" style="margin-left:auto">手动新增</button>
    </div>
    <ul id="list"></ul>
  </section>
  <section class="card" id="detail">
    <p style="color:var(--mute)">点左边的一条，在这里看详情、修改、标过时或隐藏。</p>
  </section>
</main>
</div>

<script>
(function () {
  var API = '/api/library/';
  var token = '';
  try { token = sessionStorage.getItem('dlo-token') || ''; } catch (e) {}
  var state = { offset: 0, limit: 30, total: 0, labels: {}, agents: {}, current: null };
  var $ = function (id) { return document.getElementById(id); };
  var STATUS = { active: '正流行', fading: '有点过气', dated: '过时了', unknown: '不清楚' };

  function el(tag, props, kids) {
    var n = document.createElement(tag);
    Object.keys(props || {}).forEach(function (k) {
      if (k === 'text') n.textContent = props[k]; else if (k === 'cls') n.className = props[k]; else n.setAttribute(k, props[k]);
    });
    (kids || []).forEach(function (c) { n.appendChild(typeof c === 'string' ? document.createTextNode(c) : c); });
    return n;
  }
  function say(text, bad) { var m = $('msg'); m.textContent = text || ''; m.className = bad ? 'err' : ''; }

  function api(path, opts) {
    opts = opts || {};
    var init = { method: opts.body ? 'POST' : 'GET', headers: { 'x-library-token': token } };
    if (opts.body) { init.headers['Content-Type'] = 'application/json'; init.body = JSON.stringify(Object.assign({ confirm: true }, opts.body)); }
    return fetch(API + path, init).then(function (r) {
      return r.json().then(function (j) { if (r.status === 401) throw new Error('令牌不对'); if (!r.ok) throw new Error(j.error || ('出错 ' + r.status)); return j; });
    });
  }

  function enter() {
    api('books').then(function (j) {
      $('gate').classList.add('hide'); $('app').classList.remove('hide');
      try { sessionStorage.setItem('dlo-token', token); } catch (e) {}
      state.labels = j.labels; state.agents = j.agents; state.owner = j.owner;
      var s = $('fSource'); Object.keys(j.labels).forEach(function (k) { s.appendChild(el('option', { value: k, text: j.labels[k] })); });
      var b = $('fBy'); b.appendChild(el('option', { value: 'owner', text: j.owner }));
      Object.keys(j.agents).forEach(function (k) { b.appendChild(el('option', { value: k, text: (j.agents[k] && j.agents[k].name) || k })); });
      var st = $('fStatus'); Object.keys(STATUS).forEach(function (k) { st.appendChild(el('option', { value: k, text: STATUS[k] })); });
      st.appendChild(el('option', { value: 'hidden', text: '已隐藏' }));
      refresh(); loadStats();
    }).catch(function (e) { $('gateMsg').textContent = e.message; });
  }

  function loadStats() {
    api('stats').then(function (s) {
      var parts = ['共 ' + s.total + ' 条'];
      Object.keys(s.bySource).forEach(function (k) { parts.push((state.labels[k] || k) + ' ' + s.bySource[k]); });
      parts.push('带标记 ' + s.flagged, '隐藏 ' + s.hidden);
      $('stats').textContent = parts.join(' · ');
    });
  }

  function refresh() {
    var p = new URLSearchParams({ source: $('fSource').value, by: $('fBy').value, status: $('fStatus').value, q: $('q').value,
      offset: state.offset, limit: state.limit });
    api('list?' + p.toString()).then(function (j) {
      state.total = j.total;
      $('total').textContent = '找到 ' + j.total + ' 条';
      var ul = $('list'); ul.textContent = '';
      j.items.forEach(function (e) { ul.appendChild(row(e)); });
      if (!j.items.length) ul.appendChild(el('li', { text: '没有符合的条目。', cls: 'hist' }));
    }).catch(function (e) { say(e.message, true); });
  }

  function row(e) {
    var li = el('li', { cls: 'item' + (e.hidden ? ' dim' : '') + (state.current === e.id ? ' on' : '') });
    var head = el('span', {}, [el('b', { text: e.name }), el('span', { cls: 'chip', text: state.labels[e.source.kind] || e.source.kind })]);
    if (e.status === 'dated' || e.status === 'fading') head.appendChild(el('span', { cls: 'chip', text: STATUS[e.status] }));
    if (e.hidden) head.appendChild(el('span', { cls: 'chip', text: '已隐藏' }));
    if (e.flags && (e.flags.profanity || e.flags.offense)) head.appendChild(el('span', { cls: 'chip flag', text: '带标记' }));
    li.appendChild(head); li.appendChild(el('span', { cls: 'b', text: e.brief || '' }));
    li.addEventListener('click', function () { show(e.id); });
    return li;
  }

  function field(label, node) { return el('div', {}, [el('label', { text: label }), node]); }

  function show(id) {
    api('entry?id=' + encodeURIComponent(id)).then(function (j) {
      var e = j.entry; state.current = id;
      var d = $('detail'); d.textContent = '';
      var s = e.source || {};
      d.appendChild(el('h2', { text: e.name, style: 'margin:0 0 4px' }));
      var meta = [state.labels[s.kind] || s.kind];
      if (s.by && s.kind !== 'seed') meta.push((s.by === 'owner' ? state.owner : ((state.agents[s.by] || {}).name || s.by)) + ' 存的');
      if (s.dataset) meta.push(s.dataset + (s.license ? '（' + s.license + '）' : ''));
      if (s.where) meta.push('在 ' + s.where + ' 碰到');
      if (s.url) meta.push(s.url);
      if (s.note) meta.push(s.note);
      d.appendChild(el('div', { cls: 'hist', text: meta.join(' · ') + ' · 加入 ' + (e.createdAt || '') + (e.updatedAt !== e.createdAt ? ' · 改于 ' + e.updatedAt : '') }));
      var fl = e.flags || {};
      if (fl.profanity || fl.offense) d.appendChild(el('div', { cls: 'chip flag', text: '带标记：' + [fl.profanity ? '带脏字' : '', fl.offense ? '可能冒犯人' : ''].filter(Boolean).join('、') }));

      var brief = el('textarea', { id: 'eBrief' }); brief.value = e.brief || '';
      var aliases = el('input', { type: 'text', id: 'eAlias', style: 'width:100%' }); aliases.value = (e.aliases || []).join('、');
      var origin = el('textarea', { id: 'eOrigin' }); origin.value = e.origin || '';
      var era = el('input', { type: 'text', id: 'eEra' }); era.value = e.era || '';
      var status = el('select', { id: 'eStatus' });
      Object.keys(STATUS).forEach(function (k) { var o = el('option', { value: k, text: STATUS[k] }); if (k === e.status) o.selected = true; status.appendChild(o); });
      d.appendChild(field('一句话意思（80 字以内，用自己的话）', brief));
      d.appendChild(field('别名（用顿号隔开）', aliases));
      d.appendChild(field('出处', origin));
      d.appendChild(field('流行时间', era));
      d.appendChild(field('状态', status));
      if (e.meaning) d.appendChild(el('details', {}, [el('summary', { text: '原数据集的释义' }), el('p', { text: e.meaning })]));
      if ((e.examples || []).length) d.appendChild(el('details', {}, [el('summary', { text: '例句' })].concat(e.examples.map(function (x) { return el('p', { text: x }); }))));

      var save = el('button', { cls: 'primary', text: '保存修改' });
      save.addEventListener('click', function () {
        var fields = { brief: brief.value.trim(), aliases: aliases.value.split(/[、,，]/).map(function (x) { return x.trim(); }).filter(Boolean),
          origin: origin.value, era: era.value.trim(), status: status.value };
        api('action', { body: { action: 'update', id: id, fields: fields } }).then(function () { say('已保存'); show(id); refresh(); loadStats(); })
          .catch(function (er) { say(er.message, true); });
      });
      var dated = el('button', { text: e.status === 'dated' ? '取消过时' : '标成过时' });
      dated.addEventListener('click', function () {
        api('action', { body: { action: 'mark', id: id, status: e.status === 'dated' ? 'unknown' : 'dated' } }).then(function () { say('已更新'); show(id); refresh(); })
          .catch(function (er) { say(er.message, true); });
      });
      var hide = el('button', { cls: e.hidden ? '' : 'warn', text: e.hidden ? '取消隐藏' : '隐藏' });
      hide.addEventListener('click', function () {
        api('action', { body: { action: 'mark', id: id, hidden: !e.hidden } }).then(function () { say('已更新'); show(id); refresh(); loadStats(); })
          .catch(function (er) { say(er.message, true); });
      });
      d.appendChild(el('div', { cls: 'row', style: 'margin-top:12px' }, [save, dated, hide]));

      var hist = (e.history || []).slice().reverse();
      var hd = el('details', { style: 'margin-top:12px' }, [el('summary', { text: '改动记录（' + hist.length + '）' })]);
      hist.forEach(function (h) {
        var who = h.by === 'owner' ? state.owner : (h.by === 'import' ? '导入' : ((state.agents[h.by] || {}).name || h.by));
        var t = (h.at || '') + ' ' + who + ' ' + (h.op === 'add' ? '加入' : '改了 ' + (h.fields || []).join('、'));
        hd.appendChild(el('div', { cls: 'hist', text: t }));
      });
      d.appendChild(hd);
      refresh();
    }).catch(function (er) { say(er.message, true); });
  }

  function addForm() {
    state.current = null;
    var d = $('detail'); d.textContent = '';
    d.appendChild(el('h2', { text: '手动新增', style: 'margin:0 0 4px' }));
    d.appendChild(el('div', { cls: 'hist', text: '新增的条目，来源会记成「' + (state.labels.owner || '手填') + '」。' }));
    var name = el('input', { type: 'text', style: 'width:100%' });
    var brief = el('textarea', {});
    var aliases = el('input', { type: 'text', style: 'width:100%' });
    var origin = el('textarea', {});
    var era = el('input', { type: 'text' });
    d.appendChild(field('梗的名字', name));
    d.appendChild(field('一句话意思（80 字以内）', brief));
    d.appendChild(field('别名（用顿号隔开）', aliases));
    d.appendChild(field('出处', origin));
    d.appendChild(field('流行时间', era));
    var go = el('button', { cls: 'primary', text: '存进去' });
    go.addEventListener('click', function () {
      api('action', { body: { action: 'add', name: name.value.trim(), brief: brief.value.trim(),
        aliases: aliases.value.split(/[、,，]/).map(function (x) { return x.trim(); }).filter(Boolean), origin: origin.value, era: era.value.trim() } })
        .then(function (j) { say('已存进去'); loadStats(); refresh(); show(j.entry.id); }).catch(function (er) { say(er.message, true); });
    });
    d.appendChild(el('div', { cls: 'row', style: 'margin-top:12px' }, [go]));
  }

  $('gateForm').addEventListener('submit', function (ev) { ev.preventDefault(); token = $('tok').value.trim(); enter(); });
  ['fSource', 'fBy', 'fStatus'].forEach(function (id) { $(id).addEventListener('change', function () { state.offset = 0; refresh(); }); });
  var timer = null;
  $('q').addEventListener('input', function () { clearTimeout(timer); timer = setTimeout(function () { state.offset = 0; refresh(); }, 250); });
  $('prev').addEventListener('click', function () { state.offset = Math.max(0, state.offset - state.limit); refresh(); });
  $('next').addEventListener('click', function () { if (state.offset + state.limit < state.total) { state.offset += state.limit; refresh(); } });
  $('addBtn').addEventListener('click', addForm);
  if (token) enter();
})();
</script>
</body>
</html>
